name: Swift

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_spm_mac:
    runs-on: macos-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build & Run tests
        run: swift test

  build_and_test_ios:
    runs-on: macos-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -scheme InferiseAnalytics test -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17'

  build_and_test_tvos:
    runs-on: macos-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -scheme InferiseAnalytics test -sdk appletvsimulator -destination 'platform=tvOS Simulator,name=Apple TV'

  build_and_test_watchos:
    runs-on: macos-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -scheme InferiseAnalytics test -sdk watchsimulator -destination 'platform=watchOS Simulator,name=Apple Watch Ultra 3 (49mm)'

  build_and_test_visionos:
    runs-on: macos-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -scheme InferiseAnalytics test -destination 'platform=visionOS Simulator,name=Apple Vision Pro'

  build_and_test_examples:
    runs-on: macos-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: BasicExample
        run: |
          cd Examples/apps/BasicExample
          xcodebuild -workspace "BasicExample.xcworkspace" -scheme "BasicExample" -sdk iphonesimulator
      - name: InferiseUIKitExample
        run: |
          cd Examples/apps/InferiseUIKitExample
          xcodebuild -workspace "InferiseUIKitExample.xcworkspace" -scheme "InferiseUIKitExample" -sdk iphonesimulator
      - name: InferiseWeatherWidget
        run: |
          cd Examples/apps/InferiseWeatherWidget
          xcodebuild -workspace "InferiseWeatherWidget.xcworkspace" -scheme "InferiseWeatherWidget" -sdk iphonesimulator
      - name: Mac Catalyst
        run: |
          cd Examples/apps/InferiseUIKitExample
          xcodebuild -workspace "InferiseUIKitExample.xcworkspace" -scheme "InferiseUIKitExample" -destination 'platform=macOS,variant=Mac Catalyst'
